<style>
  :root{
    --ink:#131C2E;         /* navy ink - text, sidebar */
    --ink-soft:#2A3A57;
    --steel:#3D6B94;       /* primary action */
    --steel-dark:#2C5170;
    --slate-bg:#EEF1F5;    /* app background */
    --panel:#FFFFFF;
    --line:#DCE1E8;
    --amber:#D98C2B;       /* accent / partial status */
    --amber-bg:#FBF0DE;
    --green:#2F7D53;       /* success / delivered */
    --green-bg:#E4F2E9;
    --red:#B6483F;         /* danger / not delivered */
    --red-bg:#F7E7E5;
  }
  *{font-family:'Inter',system-ui,sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  body{background:var(--slate-bg); color:var(--ink);}
  .brandmark{
    font-weight:800; letter-spacing:0.02em; font-size:1.35rem; color:#fff;
  }
  .sidebar{background:var(--ink);}
  .navitem{color:#B9C3D6; transition:background .15s,color .15s;}
  .navitem:hover{background:var(--ink-soft); color:#fff;}
  .navitem.active{background:var(--steel); color:#fff;}
  .btn-primary{background:var(--steel); color:#fff; transition:background .15s;}
  .btn-primary:hover{background:var(--steel-dark);}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-outline{border:1px solid var(--line); color:var(--ink); background:#fff;}
  .btn-outline:hover{border-color:var(--steel); color:var(--steel);}
  .btn-danger{background:var(--red); color:#fff;}
  .btn-danger:hover{opacity:.88;}
  .panel{background:var(--panel); border:1px solid var(--line);}
  input[type=text], input[type=number], input[type=password], input[type=month], input[type=date], select, textarea{
    border:1px solid var(--line); background:#fff; border-radius:6px; padding:.5rem .65rem; font-size:.875rem; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--steel); outline-offset:1px; border-color:var(--steel);}
  table.data th{font-size:.72rem; text-transform:none; letter-spacing:0.01em; color:#5B6B85; font-weight:600; text-align:left; padding:.55rem .65rem; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.data td{padding:.55rem .65rem; border-bottom:1px solid #EEF0F3; font-size:.83rem; vertical-align:top;}
  table.data tr:hover td{background:#FAFBFC;}
  .badge{display:inline-flex; align-items:center; gap:.3rem; padding:.2rem .55rem; border-radius:5px; font-size:.72rem; font-weight:600;}
  .badge-none{background:var(--red-bg); color:var(--red);}
  .badge-partial{background:var(--amber-bg); color:var(--amber);}
  .badge-full{background:var(--green-bg); color:var(--green);}
  .modal-backdrop{background:rgba(19,28,46,.55);}
  ::-webkit-scrollbar{height:8px; width:8px;}
  ::-webkit-scrollbar-thumb{background:#C7CEDA; border-radius:4px;}
  .fade-in{animation:fadeIn .18s ease-out;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .link-btn{color:var(--steel); font-weight:600; cursor:pointer;}
  .link-btn:hover{text-decoration:underline;}
</style>

<script>
/* ========================================================================
   FIREBASE INIT
   ======================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyADKOR3avOawahRDCqSAof-mCKsEnw5DFY",
  authDomain: "hvbg-12793.firebaseapp.com",
  databaseURL: "https://hvbg-12793-default-rtdb.firebaseio.com", // ⚠️ THAY bằng URL thật của bạn — xem hướng dẫn bên dưới
  projectId: "hvbg-12793",
  storageBucket: "hvbg-12793.firebasestorage.app",
  messagingSenderId: "741904148613",
  appId: "1:741904148613:web:ec7a8ceb26cd32ffd0a1ec",
  measurementId: "G-PZ4332SP3N"
};
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const EMAIL_SUFFIX = "@hosiden.local";
const ADMIN_USERNAME = "admin";
const ADMIN_DEFAULT_PW = "hvbg2025";

function toEmail(username){ return username.trim().toLowerCase() + EMAIL_SUFFIX; }

/* ========================================================================
   STATE
   ======================================================================== */
let currentUser = null;
let currentProfile = null;   // {username, role, supplierName, disabled}
let suppliers = {};          // uid -> profile   (admin only, live)
let orders = {};             // orderId -> order (live, scoped by role)
let currentPage = 'orders';
let ordersListenerRef = null;
let suppliersListenerRef = null;

/* ========================================================================
   AUTH FLOW
   ======================================================================== */
const loginForm = document.getElementById('login-form');
const loginError = document.getElementById('login-error');
const loginBtn = document.getElementById('login-btn');

function showLoginError(msg){
  loginError.textContent = msg;
  loginError.classList.remove('hidden');
}
function clearLoginError(){ loginError.classList.add('hidden'); }

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearLoginError();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if(!username || !password) return;
  loginBtn.disabled = true; loginBtn.textContent = 'Đang đăng nhập...';
  try{
    await doLogin(username, password);
  }catch(err){
    showLoginError(friendlyAuthError(err));
  }finally{
    loginBtn.disabled = false; loginBtn.textContent = 'Đăng nhập';
  }
});

async function doLogin(username, password){
  const email = toEmail(username);
  try{
    await auth.signInWithEmailAndPassword(email, password);
    return;
  }catch(err){
    // First-run bootstrap: allow the seeded admin account to self-create once.
    // Newer Firebase projects have "Email Enumeration Protection" on by default,
    // which returns the generic 'auth/invalid-credential' for BOTH "no such user"
    // and "wrong password" — so we treat it the same as user-not-found here.
    const bootstrapEligible = username.toLowerCase() === ADMIN_USERNAME && password === ADMIN_DEFAULT_PW &&
      ['auth/user-not-found', 'auth/invalid-credential', 'auth/wrong-password'].includes(err.code);
    if(!bootstrapEligible) throw err;
    try{
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await db.ref('users/' + cred.user.uid).set({
        username: ADMIN_USERNAME, role: 'admin', disabled: false, createdAt: Date.now()
      });
    }catch(createErr){
      // Account already exists (created previously) — the original sign-in error
      // (likely a real wrong password, or the DB profile write failed last time) stands.
      if(createErr.code === 'auth/email-already-in-use') throw err;
      throw createErr;
    }
  }
}

function friendlyAuthError(err){
  const map = {
    'auth/user-not-found': 'Tài khoản không tồn tại.',
    'auth/wrong-password': 'Sai mật khẩu.',
    'auth/invalid-credential': 'Tài khoản hoặc mật khẩu không đúng.',
    'auth/invalid-email': 'Tên tài khoản không hợp lệ.',
    'auth/too-many-requests': 'Đăng nhập sai quá nhiều lần, vui lòng thử lại sau.'
  };
  return map[err.code] || ('Đăng nhập thất bại: ' + err.message);
}

document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());

auth.onAuthStateChanged(async (user) => {
  detachListeners();
  if(!user){
    currentUser = null; currentProfile = null;
    document.getElementById('view-app').classList.add('hidden');
    document.getElementById('view-login').classList.remove('hidden');
    return;
  }
  currentUser = user;
  try{
    const snap = await db.ref('users/' + user.uid).once('value');
    const profile = snap.val();
    if(!profile){
      showLoginError('Không tìm thấy hồ sơ người dùng. Liên hệ quản trị viên.');
      await auth.signOut();
      return;
    }
    if(profile.disabled){
      showLoginError('Tài khoản của bạn đã bị vô hiệu hoá.');
      await auth.signOut();
      return;
    }
    currentProfile = profile;
    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('view-app').classList.remove('hidden');
    initAppShell();
  }catch(err){
    console.error(err);
    showLoginError('Có lỗi xảy ra khi tải hồ sơ người dùng.');
  }
});

function detachListeners(){
  if(ordersListenerRef) ordersListenerRef.off();
  if(suppliersListenerRef) suppliersListenerRef.off();
  orders = {}; suppliers = {};
}

/* ========================================================================
   APP SHELL / NAVIGATION
   ======================================================================== */
function initAppShell(){
  document.getElementById('sidebar-user').textContent = currentProfile.role === 'admin' ? 'Admin' : currentProfile.supplierName;
  document.getElementById('sidebar-role').textContent = currentProfile.role === 'admin' ? 'Quản trị viên' : 'Nhà cung cấp · ' + currentProfile.username;

  const nav = document.getElementById('sidebar-nav');
  const pages = currentProfile.role === 'admin'
    ? [['orders','📦 Đơn hàng'],['suppliers','🏭 Nhà cung cấp'],['reports','📊 Báo cáo']]
    : [['orders','📦 Đơn hàng của tôi']];
  nav.innerHTML = pages.map(([key,label]) =>
    `<button data-page="${key}" class="navitem w-full text-left px-3 py-2 rounded-md text-sm font-medium">${label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => setPage(btn.dataset.page)));

  attachOrdersListener();
  if(currentProfile.role === 'admin') attachSuppliersListener();

  setPage('orders');
}

function setPage(page){
  currentPage = page;
  document.querySelectorAll('#sidebar-nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  if(page === 'orders') renderOrdersPage();
  else if(page === 'suppliers') renderSuppliersPage();
  else if(page === 'reports') renderReportsPage();
}

/* ========================================================================
   DATA LISTENERS
   ======================================================================== */
function attachOrdersListener(){
  if(currentProfile.role === 'admin'){
    ordersListenerRef = db.ref('orders');
  }else{
    ordersListenerRef = db.ref('orders').orderByChild('supplierUid').equalTo(currentUser.uid);
  }
  ordersListenerRef.on('value', snap => {
    orders = snap.val() || {};
    if(currentPage === 'orders') renderOrdersPage();
    if(currentPage === 'reports') renderReportsPage();
  });
}

function attachSuppliersListener(){
  suppliersListenerRef = db.ref('users').orderByChild('role').equalTo('supplier');
  suppliersListenerRef.on('value', snap => {
    suppliers = snap.val() || {};
    if(currentPage === 'suppliers') renderSuppliersPage();
    if(currentPage === 'orders') renderOrdersPage();
  });
}

/* ========================================================================
   HELPERS
   ======================================================================== */
function fmtMonth(m){ // "2026-09" -> "Tháng 9/2026"
  if(!m) return '—';
  const [y, mo] = m.split('-');
  return `Tháng ${parseInt(mo,10)}/${y}`;
}
function quarterOf(m){
  const mo = parseInt(m.split('-')[1],10);
  return Math.ceil(mo/3);
}
function yearOf(m){ return m.split('-')[0]; }

function totalDelivered(order){
  if(!order.deliveries) return 0;
  return Object.values(order.deliveries).reduce((s,d) => s + (Number(d.qty)||0), 0);
}
function orderStatus(order){
  const d = totalDelivered(order);
  const q = Number(order.quantity)||0;
  if(d <= 0) return {key:'none', label:'Chưa giao', cls:'badge-none'};
  if(d < q) return {key:'partial', label:'Giao một phần', cls:'badge-partial'};
  return {key:'full', label:'Đã giao đủ', cls:'badge-full'};
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function ordersArray(){
  return Object.entries(orders).map(([id,o]) => ({id, ...o}));
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ========================================================================
   MODAL UTIL
   ======================================================================== */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 p-4" id="modal-overlay">
      <div class="fade-in bg-white rounded-lg shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">${html}</div>
    </div>`;
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if(e.target.id === 'modal-overlay') closeModal();
  });
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

/* ========================================================================
   PAGE: ORDERS
   ======================================================================== */
let ordersFilter = { month:'', supplierUid:'', status:'', q:'' };

function renderOrdersPage(){
  document.getElementById('page-title').textContent = currentProfile.role === 'admin' ? 'Đơn hàng' : 'Đơn hàng của tôi';

  const actions = document.getElementById('page-actions');
  actions.innerHTML = `
    ${currentProfile.role === 'admin' ? `<button id="btn-new-order" class="btn-primary rounded-md px-3.5 py-2 text-sm font-semibold">+ Tạo đơn hàng</button>` : ''}
    <button id="btn-export-orders" class="btn-outline rounded-md px-3.5 py-2 text-sm font-semibold">⬇ Xuất Excel</button>
  `;
  if(currentProfile.role === 'admin'){
    document.getElementById('btn-new-order').addEventListener('click', openCreateOrderModal);
  }
  document.getElementById('btn-export-orders').addEventListener('click', () => exportOrdersToExcel(filteredOrders(), 'Danh_sach_don_hang'));

  const list = filteredOrders();
  const stats = computeQuickStats(ordersArray());

  document.getElementById('page-content').innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      ${statCard('Tổng số đơn', stats.total, 'var(--ink)')}
      ${statCard('Chưa giao', stats.none, 'var(--red)')}
      ${statCard('Giao một phần', stats.partial, 'var(--amber)')}
      ${statCard('Đã giao đủ', stats.full, 'var(--green)')}
    </div>

    <div class="panel rounded-lg p-3 mb-4 flex flex-wrap gap-2 items-end">
      <div>
        <label class="block text-xs text-slate-500 mb-1">Tháng</label>
        <input type="month" id="f-month" value="${ordersFilter.month}" class="text-sm">
      </div>
      ${currentProfile.role === 'admin' ? `
      <div>
        <label class="block text-xs text-slate-500 mb-1">Nhà cung cấp</label>
        <select id="f-supplier" class="text-sm">
          <option value="">Tất cả</option>
          ${Object.entries(suppliers).map(([uid,s]) => `<option value="${uid}" ${ordersFilter.supplierUid===uid?'selected':''}>${esc(s.supplierName)}</option>`).join('')}
        </select>
      </div>` : ''}
      <div>
        <label class="block text-xs text-slate-500 mb-1">Trạng thái</label>
        <select id="f-status" class="text-sm">
          <option value="">Tất cả</option>
          <option value="none" ${ordersFilter.status==='none'?'selected':''}>Chưa giao</option>
          <option value="partial" ${ordersFilter.status==='partial'?'selected':''}>Giao một phần</option>
          <option value="full" ${ordersFilter.status==='full'?'selected':''}>Đã giao đủ</option>
        </select>
      </div>
      <div class="flex-1 min-w-[160px]">
        <label class="block text-xs text-slate-500 mb-1">Tìm kiếm</label>
        <input type="text" id="f-q" value="${esc(ordersFilter.q)}" placeholder="Tên/mã vật tư, mã PO, mã báo giá..." class="text-sm w-full">
      </div>
      <button id="f-clear" class="btn-outline rounded-md px-3 py-2 text-sm">Xoá lọc</button>
    </div>

    <div class="panel rounded-lg overflow-x-auto">
      <table class="data w-full">
        <thead><tr>
          <th>Tháng</th>
          ${currentProfile.role === 'admin' ? '<th>Nhà cung cấp</th>' : ''}
          <th>Tên vật tư</th>
          <th>Mã vật tư</th>
          <th>Mã báo giá</th>
          <th>Mã PO</th>
          <th class="text-right">SL đặt</th>
          <th class="text-right">SL đã giao</th>
          <th>Trạng thái</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${list.length ? list.map(rowOrderHtml).join('') : `<tr><td colspan="10" class="text-center text-slate-400 py-8">Chưa có đơn hàng nào phù hợp.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('f-month').addEventListener('change', e => { ordersFilter.month = e.target.value; renderOrdersPage(); });
  if(currentProfile.role === 'admin'){
    document.getElementById('f-supplier').addEventListener('change', e => { ordersFilter.supplierUid = e.target.value; renderOrdersPage(); });
  }
  document.getElementById('f-status').addEventListener('change', e => { ordersFilter.status = e.target.value; renderOrdersPage(); });
  document.getElementById('f-q').addEventListener('input', e => { ordersFilter.q = e.target.value; renderOrdersPage(); });
  document.getElementById('f-clear').addEventListener('click', () => { ordersFilter = {month:'',supplierUid:'',status:'',q:''}; renderOrdersPage(); });

  list.forEach(o => {
    const openBtn = document.getElementById('open-'+o.id);
    if(openBtn) openBtn.addEventListener('click', () => openOrderDetailModal(o.id));
  });
}

function statCard(label, value, color){
  return `<div class="panel rounded-lg p-4">
    <div class="text-xs text-slate-500 font-medium">${label}</div>
    <div class="text-2xl font-extrabold mt-1" style="color:${color}">${value}</div>
  </div>`;
}

function computeQuickStats(list){
  const s = {total:list.length, none:0, partial:0, full:0};
  list.forEach(o => { s[orderStatus(o).key]++; });
  return s;
}

function filteredOrders(){
  return ordersArray().filter(o => {
    if(ordersFilter.month && o.month !== ordersFilter.month) return false;
    if(ordersFilter.supplierUid && o.supplierUid !== ordersFilter.supplierUid) return false;
    if(ordersFilter.status && orderStatus(o).key !== ordersFilter.status) return false;
    if(ordersFilter.q){
      const q = ordersFilter.q.toLowerCase();
      const hay = [o.materialName,o.materialCode,o.quoteCode,o.poCode].map(x=>(x||'').toLowerCase()).join(' ');
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
}

function rowOrderHtml(o){
  const st = orderStatus(o);
  return `<tr>
    <td>${fmtMonth(o.month)}</td>
    ${currentProfile.role === 'admin' ? `<td>${esc(o.supplierName)}</td>` : ''}
    <td class="font-medium">${esc(o.materialName)}</td>
    <td class="mono">${esc(o.materialCode) || '<span class="text-slate-300">—</span>'}</td>
    <td class="mono">${esc(o.quoteCode) || '<span class="text-slate-300">—</span>'}</td>
    <td class="mono">${esc(o.poCode) || '<span class="text-slate-300">—</span>'}</td>
    <td class="text-right">${o.quantity}</td>
    <td class="text-right">${totalDelivered(o)}</td>
    <td><span class="badge ${st.cls}">${st.label}</span></td>
    <td><span id="open-${o.id}" class="link-btn text-xs">Chi tiết</span></td>
  </tr>`;
}

/* ---- Create order (admin) ---- */
function openCreateOrderModal(){
  const supplierOptions = Object.entries(suppliers).map(([uid,s]) => `<option value="${uid}">${esc(s.supplierName)}</option>`).join('');
  openModal(`
    <div class="p-5">
      <h2 class="text-base font-bold mb-4">Tạo đơn hàng mới</h2>
      <form id="create-order-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Tháng *</label>
          <input type="month" id="co-month" required class="w-full" value="${new Date().toISOString().slice(0,7)}">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Nhà cung cấp *</label>
          <select id="co-supplier" required class="w-full">
            <option value="">-- Chọn nhà cung cấp --</option>
            ${supplierOptions}
          </select>
          ${Object.keys(suppliers).length === 0 ? '<p class="text-xs mt-1" style="color:var(--red)">Chưa có nhà cung cấp nào. Vào mục "Nhà cung cấp" để tạo trước.</p>' : ''}
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Tên vật tư *</label>
          <input type="text" id="co-name" required class="w-full" placeholder="vd: Connector 2.0mm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Mã vật tư</label>
          <input type="text" id="co-code" class="w-full mono" placeholder="Có thể để nhà cung cấp bổ sung sau">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Số lượng *</label>
          <input type="number" id="co-qty" required min="1" step="1" class="w-full" placeholder="0">
        </div>
        <div id="co-error" class="hidden text-sm rounded px-3 py-2" style="background:var(--red-bg); color:var(--red);"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="btn-outline rounded-md px-4 py-2 text-sm">Huỷ</button>
          <button type="submit" class="btn-primary rounded-md px-4 py-2 text-sm font-semibold">Tạo đơn</button>
        </div>
      </form>
    </div>
  `);
  document.getElementById('create-order-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const supplierUid = document.getElementById('co-supplier').value;
    if(!supplierUid){ showFormError('co-error','Vui lòng chọn nhà cung cấp.'); return; }
    const order = {
      month: document.getElementById('co-month').value,
      supplierUid,
      supplierName: suppliers[supplierUid].supplierName,
      materialName: document.getElementById('co-name').value.trim(),
      materialCode: document.getElementById('co-code').value.trim(),
      quantity: Number(document.getElementById('co-qty').value),
      quoteCode: '', poCode: '',
      createdAt: Date.now(), createdBy: currentUser.uid
    };
    try{
      await db.ref('orders').push(order);
      closeModal();
    }catch(err){ showFormError('co-error', 'Lỗi: ' + err.message); }
  });
}
function showFormError(id, msg){
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.remove('hidden');
}

/* ---- Order detail modal (view/edit/deliveries) ---- */
function openOrderDetailModal(orderId){
  const o = orders[orderId];
  if(!o) return;
  const isAdmin = currentProfile.role === 'admin';
  const delivered = totalDelivered(o);
  const remaining = Number(o.quantity) - delivered;
  const st = orderStatus(o);
  const deliveries = o.deliveries ? Object.entries(o.deliveries).sort((a,b)=> (a[1].date||'').localeCompare(b[1].date||'')) : [];

  openModal(`
    <div class="p-5">
      <div class="flex items-start justify-between mb-4">
        <div>
          <h2 class="text-base font-bold">${esc(o.materialName)}</h2>
          <div class="text-xs text-slate-500 mt-0.5">${fmtMonth(o.month)} · ${esc(o.supplierName)}</div>
        </div>
        <span class="badge ${st.cls}">${st.label}</span>
      </div>

      <div class="grid grid-cols-2 gap-3 text-sm mb-4">
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Mã vật tư</label>
          <input type="text" id="od-code" class="w-full mono" value="${esc(o.materialCode)||''}" ${isAdmin||o.supplierUid===currentUser.uid?'':'disabled'}></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Số lượng đặt</label>
          <input type="number" id="od-qty" class="w-full" value="${o.quantity}" min="${delivered}" step="1" ${isAdmin?'':'disabled'}></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Mã báo giá</label>
          <input type="text" id="od-quote" class="w-full mono" value="${esc(o.quoteCode)||''}" placeholder="Nhà cung cấp nhập" ${isAdmin||o.supplierUid===currentUser.uid?'':'disabled'}></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Mã PO</label>
          <input type="text" id="od-po" class="w-full mono" value="${esc(o.poCode)||''}" placeholder="Nhà cung cấp nhập" ${isAdmin||o.supplierUid===currentUser.uid?'':'disabled'}></div>
      </div>
      <div id="od-error" class="hidden text-sm rounded px-3 py-2 mb-3" style="background:var(--red-bg); color:var(--red);"></div>
      <div class="flex justify-end gap-2 mb-5">
        ${isAdmin ? `<button id="od-delete" class="btn-danger rounded-md px-3 py-1.5 text-xs font-semibold">Xoá đơn</button>` : ''}
        <button id="od-save" class="btn-primary rounded-md px-3 py-1.5 text-xs font-semibold">Lưu thay đổi</button>
      </div>

      <div class="border-t pt-4" style="border-color:var(--line);">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-bold">Lịch sử giao hàng</h3>
          <div class="text-xs text-slate-500">Còn lại: <span class="font-semibold" style="color:var(--ink)">${remaining}</span> / ${o.quantity}</div>
        </div>
        <table class="data w-full mb-3">
          <thead><tr><th>Ngày giao</th><th class="text-right">Số lượng</th><th>Ghi chú</th><th></th></tr></thead>
          <tbody>
            ${deliveries.length ? deliveries.map(([did,d]) => `
              <tr>
                <td>${d.date}</td>
                <td class="text-right">${d.qty}</td>
                <td class="text-slate-500">${esc(d.note)||''}</td>
                <td><span class="link-btn text-xs del-delivery" data-did="${did}" style="color:var(--red)">Xoá</span></td>
              </tr>`).join('') : `<tr><td colspan="4" class="text-center text-slate-400 py-4">Chưa có lần giao nào.</td></tr>`}
          </tbody>
        </table>
        ${remaining > 0 ? `
        <form id="add-delivery-form" class="flex flex-wrap items-end gap-2">
          <div><label class="block text-xs text-slate-500 mb-1">Ngày giao</label><input type="date" id="dv-date" required value="${todayISO()}"></div>
          <div><label class="block text-xs text-slate-500 mb-1">Số lượng (tối đa ${remaining})</label><input type="number" id="dv-qty" required min="1" max="${remaining}" step="1" class="w-28"></div>
          <div class="flex-1 min-w-[120px]"><label class="block text-xs text-slate-500 mb-1">Ghi chú</label><input type="text" id="dv-note" class="w-full"></div>
          <button type="submit" class="btn-primary rounded-md px-3 py-2 text-xs font-semibold">+ Ghi nhận giao hàng</button>
        </form>` : `<p class="text-xs" style="color:var(--green)">✓ Đã giao đủ số lượng đặt.</p>`}
      </div>

      <div class="flex justify-end pt-4">
        <button onclick="closeModal()" class="btn-outline rounded-md px-4 py-2 text-sm">Đóng</button>
      </div>
    </div>
  `);

  document.getElementById('od-save').addEventListener('click', async () => {
    const newQty = isAdmin ? Number(document.getElementById('od-qty').value) : o.quantity;
    if(newQty < delivered){ showFormError('od-error', 'Số lượng đặt không thể nhỏ hơn số lượng đã giao.'); return; }
    const updates = {
      materialCode: document.getElementById('od-code').value.trim(),
      quoteCode: document.getElementById('od-quote').value.trim(),
      poCode: document.getElementById('od-po').value.trim(),
      quantity: newQty
    };
    try{
      await db.ref('orders/'+orderId).update(updates);
      closeModal();
    }catch(err){ showFormError('od-error','Lỗi: '+err.message); }
  });

  if(isAdmin){
    document.getElementById('od-delete').addEventListener('click', async () => {
      if(!confirm('Xoá đơn hàng này? Toàn bộ lịch sử giao hàng cũng sẽ bị xoá.')) return;
      await db.ref('orders/'+orderId).remove();
      closeModal();
    });
  }

  document.querySelectorAll('.del-delivery').forEach(el => {
    el.addEventListener('click', async () => {
      if(!confirm('Xoá lần giao hàng này?')) return;
      await db.ref(`orders/${orderId}/deliveries/${el.dataset.did}`).remove();
      openOrderDetailModal(orderId); // refresh
    });
  });

  const addForm = document.getElementById('add-delivery-form');
  if(addForm){
    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const qty = Number(document.getElementById('dv-qty').value);
      const curDelivered = totalDelivered(orders[orderId]);
      if(qty + curDelivered > Number(orders[orderId].quantity)){
        showFormError('od-error', 'Tổng số lượng giao vượt quá số lượng đặt.');
        return;
      }
      await db.ref(`orders/${orderId}/deliveries`).push({
        date: document.getElementById('dv-date').value,
        qty, note: document.getElementById('dv-note').value.trim(),
        createdAt: Date.now()
      });
      openOrderDetailModal(orderId); // refresh with updated remaining
    });
  }
}

  document.getElementById('btn-new-supplier').addEventListener('click', openCreateSupplierModal);

  const list = Object.entries(suppliers);
  document.getElementById('page-content').innerHTML = `

      <table class="data w-full">
        <thead><tr><th>Tên nhà cung cấp</th><th>Tài khoản đăng nhập</th><th class="text-right">Số đơn hàng</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody>
          ${list.length ? list.map(([uid,s]) => {
            const cnt = ordersArray().filter(o => o.supplierUid === uid).length;
            return `<tr>
              <td class="font-medium">${esc(s.supplierName)}</td>
              <td class="mono">${esc(s.username)}</td>
              <td class="text-right">${cnt}</td>
              <td>${s.disabled ? `<span class="badge badge-none">Đã khoá</span>` : `<span class="badge badge-full">Đang hoạt động</span>`}</td>
              <td><span class="link-btn text-xs toggle-supplier" data-uid="${uid}" data-disabled="${!!s.disabled}">${s.disabled ? 'Mở khoá' : 'Khoá tài khoản'}</span></td>
            </tr>`;
          }).join('') : `<tr><td colspan="5" class="text-center text-slate-400 py-8">Chưa có nhà cung cấp nào.</td></tr>`}
        </tbody>
      </table>
    </div>
    <p class="text-xs text-slate-400 mt-3">Lưu ý: để đổi mật khẩu hoặc xoá hẳn một tài khoản nhà cung cấp, thực hiện trong Firebase Console › Authentication.</p>
  `;
  document.querySelectorAll('.toggle-supplier').forEach(el => {
    el.addEventListener('click', async () => {
      const uid = el.dataset.uid;
      const isDisabled = el.dataset.disabled === 'true';
      await db.ref('users/'+uid+'/disabled').set(!isDisabled);
    });
  });
}

function openCreateSupplierModal(){
  openModal(`
    <div class="p-5">
      <h2 class="text-base font-bold mb-4">Tạo tài khoản nhà cung cấp</h2>
      <form id="create-supplier-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Tên nhà cung cấp *</label>
          <input type="text" id="cs-name" required class="w-full" placeholder="vd: Công ty TNHH ABC">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Tài khoản đăng nhập *</label>
          <input type="text" id="cs-username" required class="w-full" placeholder="vd: abc_supplier">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Mật khẩu *</label>
          <input type="text" id="cs-password" required minlength="6" class="w-full" placeholder="Tối thiểu 6 ký tự">
        </div>
        <div id="cs-error" class="hidden text-sm rounded px-3 py-2" style="background:var(--red-bg); color:var(--red);"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="btn-outline rounded-md px-4 py-2 text-sm">Huỷ</button>
          <button type="submit" id="cs-submit" class="btn-primary rounded-md px-4 py-2 text-sm font-semibold">Tạo tài khoản</button>
        </div>
      </form>
    </div>
  `);
  document.getElementById('create-supplier-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('cs-submit');
    submitBtn.disabled = true; submitBtn.textContent = 'Đang tạo...';
    const supplierName = document.getElementById('cs-name').value.trim();
    const username = document.getElementById('cs-username').value.trim();
    const password = document.getElementById('cs-password').value;
    // Use a secondary Firebase app instance so creating this account
    // doesn't sign the admin out of their own session.
    let secondaryApp;
    try{
      secondaryApp = firebase.apps.find(a => a.name === 'Secondary') || firebase.initializeApp(firebaseConfig, 'Secondary');
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(toEmail(username), password);
      await db.ref('users/'+cred.user.uid).set({
        username, role: 'supplier', supplierName, disabled: false, createdAt: Date.now()
      });
      await secondaryApp.auth().signOut();
      closeModal();
    }catch(err){
      const map = {'auth/email-already-in-use':'Tài khoản này đã tồn tại.', 'auth/weak-password':'Mật khẩu quá yếu (tối thiểu 6 ký tự).'};
      showFormError('cs-error', map[err.code] || ('Lỗi: '+err.message));
      submitBtn.disabled = false; submitBtn.textContent = 'Tạo tài khoản';
    }
  });
}

/* ========================================================================
   PAGE: REPORTS (admin only)
   ======================================================================== */
let reportPeriod = 'month'; // month | quarter | year
let reportChart = null;

function renderReportsPage(){
  document.getElementById('page-title').textContent = 'Báo cáo tổng hợp';
  document.getElementById('page-actions').innerHTML = `<button id="btn-export-report" class="btn-outline rounded-md px-3.5 py-2 text-sm font-semibold">⬇ Xuất Excel</button>`;

  const groups = buildReportGroups(reportPeriod);

  document.getElementById('page-content').innerHTML = `
    <div class="panel rounded-lg p-3 mb-4 flex gap-2">
      ${['month','quarter','year'].map(p => `<button data-p="${p}" class="rp-btn text-sm px-3 py-1.5 rounded-md font-medium ${reportPeriod===p ? 'btn-primary' : 'btn-outline'}">${p==='month'?'Theo tháng':p==='quarter'?'Theo quý':'Theo năm'}</button>`).join('')}
    </div>

    <div class="panel rounded-lg p-4 mb-4">
      <canvas id="report-chart" height="90"></canvas>
    </div>

    <div class="panel rounded-lg overflow-x-auto">
      <table class="data w-full">
        <thead><tr>
          <th>Kỳ</th><th>Nhà cung cấp</th><th class="text-right">Số đơn</th><th class="text-right">SL đặt</th><th class="text-right">SL đã giao</th><th class="text-right">Tỉ lệ hoàn thành</th>
        </tr></thead>
        <tbody>
          ${groups.rows.length ? groups.rows.map(r => `<tr>
            <td>${r.periodLabel}</td>
            <td>${esc(r.supplierName)}</td>
            <td class="text-right">${r.count}</td>
            <td class="text-right">${r.qty}</td>
            <td class="text-right">${r.delivered}</td>
            <td class="text-right">${r.qty ? Math.round(r.delivered/r.qty*100) : 0}%</td>
          </tr>`).join('') : `<tr><td colspan="6" class="text-center text-slate-400 py-8">Chưa có dữ liệu.</td></tr>`}
        </tbody>
        ${groups.rows.length ? `<tfoot><tr class="font-bold">
          <td colspan="2">Tổng cộng</td>
          <td class="text-right">${groups.totals.count}</td>
          <td class="text-right">${groups.totals.qty}</td>
          <td class="text-right">${groups.totals.delivered}</td>
          <td class="text-right">${groups.totals.qty ? Math.round(groups.totals.delivered/groups.totals.qty*100) : 0}%</td>
        </tr></tfoot>` : ''}
      </table>
    </div>
  `;

  document.querySelectorAll('.rp-btn').forEach(b => b.addEventListener('click', () => { reportPeriod = b.dataset.p; renderReportsPage(); }));
  document.getElementById('btn-export-report').addEventListener('click', () => exportReportToExcel(groups));

  drawReportChart(groups);
}

function periodKeyAndLabel(o, period){
  if(period === 'month') return [o.month, fmtMonth(o.month)];
  if(period === 'quarter') return [yearOf(o.month)+'-Q'+quarterOf(o.month), 'Quý '+quarterOf(o.month)+'/'+yearOf(o.month)];
  return [yearOf(o.month), 'Năm '+yearOf(o.month)];
}

function buildReportGroups(period){
  const map = {}; // key(period+supplier) -> row
  const totals = {count:0, qty:0, delivered:0};
  ordersArray().forEach(o => {
    if(!o.month) return;
    const [pKey, pLabel] = periodKeyAndLabel(o, period);
    const key = pKey + '|' + o.supplierUid;
    if(!map[key]) map[key] = {periodKey:pKey, periodLabel:pLabel, supplierName:o.supplierName, count:0, qty:0, delivered:0};
    map[key].count++;
    map[key].qty += Number(o.quantity)||0;
    map[key].delivered += totalDelivered(o);
    totals.count++; totals.qty += Number(o.quantity)||0; totals.delivered += totalDelivered(o);
  });
  const rows = Object.values(map).sort((a,b) => a.periodKey.localeCompare(b.periodKey) || a.supplierName.localeCompare(b.supplierName));
  return {rows, totals};
}

function drawReportChart(groups){
  const byPeriod = {};
  groups.rows.forEach(r => {
    byPeriod[r.periodLabel] = byPeriod[r.periodLabel] || {qty:0, delivered:0};
    byPeriod[r.periodLabel].qty += r.qty;
    byPeriod[r.periodLabel].delivered += r.delivered;
  });
  const labels = Object.keys(byPeriod);
  const ctx = document.getElementById('report-chart');
  if(reportChart) reportChart.destroy();
  reportChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {label: 'Số lượng đặt', data: labels.map(l=>byPeriod[l].qty), backgroundColor: '#3D6B94'},
        {label: 'Số lượng đã giao', data: labels.map(l=>byPeriod[l].delivered), backgroundColor: '#2F7D53'}
      ]
    },
    options: { responsive:true, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}} }
  });
}

/* ========================================================================
   EXCEL EXPORT
   ======================================================================== */
function exportOrdersToExcel(list, filenameBase){
  const rows = list.map(o => ({
    'Tháng': fmtMonth(o.month),
    'Nhà cung cấp': o.supplierName,
    'Tên vật tư': o.materialName,
    'Mã vật tư': o.materialCode || '',
    'Mã báo giá': o.quoteCode || '',
    'Mã PO': o.poCode || '',
    'Số lượng đặt': o.quantity,
    'Số lượng đã giao': totalDelivered(o),
    'Trạng thái': orderStatus(o).label,
    'Chi tiết các lần giao': o.deliveries ? Object.values(o.deliveries).map(d => `${d.date}: ${d.qty}${d.note ? ' ('+d.note+')' : ''}`).join(' | ') : ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Đơn hàng');
  XLSX.writeFile(wb, `${filenameBase}_${todayISO()}.xlsx`);
}

function exportReportToExcel(groups){
  const rows = groups.rows.map(r => ({
    'Kỳ': r.periodLabel, 'Nhà cung cấp': r.supplierName, 'Số đơn': r.count,
    'SL đặt': r.qty, 'SL đã giao': r.delivered,
    'Tỉ lệ hoàn thành (%)': r.qty ? Math.round(r.delivered/r.qty*100) : 0
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Báo cáo');
  XLSX.writeFile(wb, `Bao_cao_tong_hop_${todayISO()}.xlsx`);
}
